version: '3.8'

networks:
  cache-net:
    driver: bridge

services:
  cache-node-1:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: dcache-node-1
    hostname: dcache-node-1
    environment:
      DCACHE_NODE_ID: node1
      DCACHE_HOST: dcache-node-1
      DCACHE_REST_PORT: "8000"
      DCACHE_GRPC_PORT: "50051"
      DCACHE_SEED_NODES: ""
      DCACHE_EVICTION_POLICY: lru
      DCACHE_MAX_KEYS: "10000"
      DCACHE_LOG_LEVEL: INFO
    ports:
      - "8001:8000"
    networks:
      - cache-net
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3

  cache-node-2:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: dcache-node-2
    hostname: dcache-node-2
    environment:
      DCACHE_NODE_ID: node2
      DCACHE_HOST: dcache-node-2
      DCACHE_REST_PORT: "8000"
      DCACHE_GRPC_PORT: "50051"
      DCACHE_SEED_NODES: "dcache-node-1:8000"
      DCACHE_EVICTION_POLICY: lru
      DCACHE_MAX_KEYS: "10000"
      DCACHE_LOG_LEVEL: INFO
    ports:
      - "8002:8000"
    networks:
      - cache-net
    depends_on:
      cache-node-1:
        condition: service_healthy

  cache-node-3:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: dcache-node-3
    hostname: dcache-node-3
    environment:
      DCACHE_NODE_ID: node3
      DCACHE_HOST: dcache-node-3
      DCACHE_REST_PORT: "8000"
      DCACHE_GRPC_PORT: "50051"
      DCACHE_SEED_NODES: "dcache-node-1:8000"
      DCACHE_EVICTION_POLICY: lru
      DCACHE_MAX_KEYS: "10000"
      DCACHE_LOG_LEVEL: INFO
    ports:
      - "8003:8000"
    networks:
      - cache-net
    depends_on:
      cache-node-1:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: dcache-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - cache-net
    depends_on:
      - cache-node-1
      - cache-node-2
      - cache-node-3
